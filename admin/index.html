<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Content Manager</title>


<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hithismani/responsive-decap@main/dist/responsive.css"> <!-- Unminfied -->

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/hithismani/responsive-decap@main/dist/responsive.min.css"> <!-- Untested, but Minified -->





  </head>
  <body>
    <!-- Include the script that builds the page and powers Decap CMS -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>





<script>
  // Register custom styles for the CMS editor
  CMS.registerPreviewStyle(`
    /* Make sure the color picker isn't clipped */
    .nc-colorControl {
      z-index: 2000 !important;
    }

    .nc-widget {
      overflow: visible !important;
    }

    /* Ensure lists of objects (like colors) have enough space */
    .nc-objectControl {
      overflow: visible !important;
    }
  `, { raw: true });
</script>

  </body>
</html>
