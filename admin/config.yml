backend:
  name: github
  repo: shaw-mct/shaw       # Your GitHub repo
  branch: main
  base_url: https://cms-auth-shaw.vercel.app

# 📸 Where images are saved
media_folder: "img"         # folder in the repo
public_folder: "/img"       # public URL path

collections:
  - name: "products"
    label: "المنتجات"             # This shows as the collection name in the sidebar
    label_singular: "منتج جديد"   # This changes the "New Product" button text
    folder: "_products"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Layout", name: "layout", widget: "hidden", default: "product" }
      - { label: "العنوان", name: "title", widget: "string" }
      - { label: "السعر", name: "price", widget: "number", value_type: "float" }
      - { label: "الصورة الرئيسية", name: "image", widget: "image" }
      - label: "معرض الصور"
        name: "images"
        widget: "list"
        field: { label: "صورة", name: "image", widget: "image" }
      - { label: "الوصف", name: "description", widget: "text" }
      - label: "المقاسات"
        name: "sizes"
        widget: "list"
        field: { label: "مقاس", name: "size", widget: "string" }
      - label: "الألوان"
        name: "colors"
        widget: "list"
        fields:
          - { label: "الاسم", name: "name", widget: "string" }
          - { label: "الرمز", name: "code", widget: "color" }


  # 🪄 Dummy section (no real use, just exists)
  - name: "dummy_section"
    label: "🪄 Dummy Section"
    folder: "_dummy_section"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Useless Title", name: "useless_title", widget: "string", required: false }
      - { label: "Useless Text", name: "useless_text", widget: "text", required: false }
      - { label: "Completely Pointless Number", name: "useless_number", widget: "number", required: false }
